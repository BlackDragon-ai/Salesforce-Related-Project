name: UAT Validation

on:
  pull_request:
    branches:
      - UAT
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  code-scan:
    name: Static code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Placeholder static code scan
        run: |
          echo "Static code scanning is enabled and reserved for future checks."
          echo "No failing rules are enforced yet."

  validate:
    name: Validate metadata on UAT
    needs: code-scan
    runs-on: ubuntu-latest
    environment: UAT
    permissions:
      contents: read
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      SF_TEST_CLASSES: ${{ vars.SF_TEST_CLASSES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Validate auth configuration
        run: bash .github/scripts/validate-auth.sh

      - name: Authenticate to Salesforce
        run: bash .github/scripts/authenticate-sf.sh

      - name: Generate delta package and validate deployment
        run: bash .github/scripts/run-sf-validation.sh "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" "${{ runner.temp }}/sf-delta"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-validation-artifacts
          path: |
            ${{ runner.temp }}/sf-delta
          if-no-files-found: warn
