name: CI Deployment

on:
  push:
    branches:
      - DEV
  workflow_dispatch:

jobs:
  approval-gate:
    name: PR approval gate
    runs-on: ubuntu-latest
    steps:
      - name: Check that the merge is approved before deployment
        run: |
          echo "This workflow is intended for merged, approved changes only."
          echo "Use GitHub branch protection / PR review requirements before running deployment."

  validate:
    name: CI validation before deployment
    needs: approval-gate
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: read
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      SF_TEST_CLASSES: ${{ vars.SF_TEST_CLASSES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Validate auth configuration
        run: bash .github/scripts/validate-auth.sh

      - name: Authenticate to Salesforce
        run: bash .github/scripts/authenticate-sf.sh

      - name: Run validation before deployment
        run: bash .github/scripts/run-sf-validation.sh "${{ github.event.before || 'HEAD~1' }}" "${{ runner.temp }}/sf-delta"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-deploy-validation-artifacts
          path: |
            ${{ runner.temp }}/sf-delta
          if-no-files-found: warn

  deploy:
    name: Deploy approved CI delta
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: read
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      SF_TEST_CLASSES: ${{ vars.SF_TEST_CLASSES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Validate auth configuration
        run: bash .github/scripts/validate-auth.sh

      - name: Authenticate to Salesforce
        run: bash .github/scripts/authenticate-sf.sh

      - name: Generate delta package and deploy
        run: bash .github/scripts/run-sf-deploy.sh "${{ github.event.before || 'HEAD~1' }}" "${{ runner.temp }}/sf-delta"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-deployment-artifacts
          path: |
            ${{ runner.temp }}/sf-delta
          if-no-files-found: warn
