name: Production Deployment

on:
  workflow_dispatch:

jobs:
  approval-gate:
    name: Manual approval gate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Wait for production approval
        run: echo "Production deployment requires GitHub Environment approval."

  validate:
    name: Production validation before deployment
    needs: approval-gate
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      SF_TEST_CLASSES: ${{ vars.SF_TEST_CLASSES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Validate auth configuration
        run: bash .github/scripts/validate-auth.sh

      - name: Authenticate to Salesforce
        run: bash .github/scripts/authenticate-sf.sh

      - name: Run validation before deployment
        run: bash .github/scripts/run-sf-validation.sh "${{ github.event.before || 'HEAD~1' }}" "${{ runner.temp }}/sf-delta"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-validation-artifacts
          path: |
            ${{ runner.temp }}/sf-delta
          if-no-files-found: warn

  deploy:
    name: Deploy approved Production delta
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      SF_TEST_CLASSES: ${{ vars.SF_TEST_CLASSES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Validate auth configuration
        run: bash .github/scripts/validate-auth.sh

      - name: Authenticate to Salesforce
        run: bash .github/scripts/authenticate-sf.sh

      - name: Generate delta package and deploy
        run: bash .github/scripts/run-sf-deploy.sh "${{ github.event.before || 'HEAD~1' }}" "${{ runner.temp }}/sf-delta"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-artifacts
          path: |
            ${{ runner.temp }}/sf-delta
          if-no-files-found: warn
